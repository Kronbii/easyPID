name: Build

on:
  # Pushes to a topic branch are covered by its pull request, so listing only
  # main here avoids every PR running the whole matrix twice.
  push:
    branches: [main]
  pull_request:

jobs:
  compile-examples:
    name: Compile examples (${{ matrix.board.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full platforms block lives in the matrix. Passing an empty
        # source-url for the bundled AVR core makes the action parse it as null
        # and crash in sort_dependency_list, so the key must be absent entirely
        # rather than present and empty.
        board:
          - name: Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - name: Mega 2560
            fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
          - name: ESP32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile all examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          # Warnings are errors here: the library shipped a "PI redefined"
          # warning on every build for an entire release because nothing
          # checked. Keep it that way.
          enable-warnings-report: true
          verbose: false

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run the host test suites
        working-directory: extras/test
        run: make test
