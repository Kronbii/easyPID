name: Bug report
description: Report a reproducible problem with easyPID.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please provide enough detail for us to reproduce and fix the issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal sketch when possible.
      placeholder: |
        1. Configure controller with ...
        2. Call update(...) with ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: easyPID version
      description: Release tag or commit SHA.
      placeholder: v1.0.0 or abc1234
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board/core
      description: Target board and Arduino core version.
      placeholder: Arduino Uno, arduino:avr@1.8.6
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: Tooling version
      description: Arduino IDE or CLI version.
      placeholder: Arduino IDE 2.3.2 or arduino-cli 1.0.4
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Logs, screenshots, plots, or anything else helpful.
    validations:
      required: false
