sentence=Multi-featured PID controller with anti-windup, derivative filtering, and optional autotuning
paragraph=A feature-rich PID controller library for Arduino offering multi-instance support, flexible timing modes (automatic millis-based or manual dt input), advanced anti-windup protection, derivative filtering for noise reduction, full state introspection for debugging, and an optional relay-based autotuner module with multiple tuning rules. Hardware-agnostic and AVR-optimized. Based on proven field-tested implementation.
