sentence=Multi-featured PID controller with anti-windup, derivative filtering, and optional autotuning
paragraph=Supports multiple independent instances with no global state, automatic millis()-based or caller-supplied timing, selectable anti-windup and derivative-filter modes, configurable output and integral limits, DIRECT/REVERSE action, and full P/I/D state introspection for debugging. The relay autotuner is an opt-in module: include PIDTuner.h to use it. Hardware-agnostic and AVR-friendly.
category=Device Control
